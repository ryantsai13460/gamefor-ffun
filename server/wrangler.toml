name = "gamefor-ffun-gateway"
main = "worker.js"
compatibility_date = "2026-04-06"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://ryantsai13460.github.io"
CHAT_PROVIDER = "auto"
OPENAI_MODEL = "gpt-4.1-mini"
# Optional. Configure these only after checking your provider's model access and cost.
# OPENAI_ADVANCED_MODEL = "your-authorized-model"
# OPENAI_ADVANCED_MAX_TOKENS = "1800"
# OPENAI_ADVANCED_REASONING_EFFORT = "medium"
# WORKERS_AI_ADVANCED_MODEL = "@cf/google/gemma-4-26b-a4b-it"

[ai]
binding = "AI"

[[ratelimits]]
name = "CLIENT_RATE_LIMITER"
namespace_id = "61101"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "SITE_RATE_LIMITER"
namespace_id = "61102"
simple = { limit = 15, period = 60 }
