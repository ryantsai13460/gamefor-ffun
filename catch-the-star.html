<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catch the Star</title>
    <style>
      body {
        background: #151520;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
        padding: clamp(12px, 6vw, 30px);
      }

      button {
        background: gold;
        border: none;
        border-radius: 12px;
        padding: 30px;
        font-size: 45px;
        cursor: pointer;
        margin-top: 30px;
        touch-action: manipulation;
      }

      button:focus-visible { outline: 2px solid white; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <h1>⭐ Catch the Star!</h1>
    <p>Click, tap, or press the star button to earn points!</p>
    <h2 id="score" role="status">Score: 0</h2>

    <button id="star" type="button" aria-label="Catch the star">⭐</button>

    <script>
      let score = 0;

      document.getElementById('star').onclick = () => {
        score++;
        document.getElementById('score').textContent = 'Score: ' + score;
      };
    </script>
  </body>
</html>
